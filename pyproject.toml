[project]
name = "kelmarsh-twin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
