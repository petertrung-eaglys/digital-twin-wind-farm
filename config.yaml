scada:
  timestamp_column: "Date and time"   # timestamps are UTC (file metadata)
signals:
  # Confirmed with inspect_data.py: identical in all 6 Turbine_Data files
  wind_speed: "Wind speed (m/s)"
  power: "Power (kW)"
  wind_direction: "Wind direction (°)"
  nacelle_direction: "Nacelle position (°)"
  ambient_temp: "Ambient temperature (converter) (°C)"
  pitch: "Blade angle (pitch position) A (°)"
  rotor_speed: "Rotor speed (RPM)"
sampling:
  interval_minutes: 10
cleaning:
  min_wind_speed: 3.0
  max_wind_speed: 25.0
  max_pitch_deg: 5.0
  min_power_kw: 0.0
  rated_wind_speed: 12.0       # MM92 rated wind speed, used for the pitch rule
  standard_pressure_pa: 101325.0
model:
  # Sensor signals the power model reads; air_density and the sin/cos of
  # wind direction are derived from them.
  inputs: [wind_speed, wind_direction, ambient_temp]
  target: power
train_test_split:
  train_end: "2021-12-31 23:50"   # train 2016-2021, test 2022-2024
alerts:
  window_samples: 144          # 24 hours of 10-minute data
  threshold_fraction: -0.05    # mean residual below -5% of rated power
  min_duration_samples: 36     # 6 hours
dashboard:
  # plotly map style: "satellite" = Esri World Imagery (no token needed);
  # alternatives: "satellite-streets", "carto-positron", "open-street-map"
  map_style: satellite
  # Random sample of normal rows drawn in the power curve (all years together
  # are ~370k points per turbine, too many to resend on every replay tick)
  power_curve_max_points: 50000
